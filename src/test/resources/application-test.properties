# ── Base de datos H2 en memoria para tests ─────────────────────────────────
spring.datasource.url=jdbc:h2:mem:aulaclicktest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# ── JWT ─────────────────────────────────────────────────────────────────────
jwt.secret=aulaclick-test-secret-key-minimum-256-bits-long-do-not-use-in-production

# ── Cloudinary (valores ficticios; los tests no llaman a la API real) ───────
cloudinary.cloud-name=test-cloud
cloudinary.api-key=000000000000000
cloudinary.api-secret=test-api-secret-dummy

# ── Logging reducido ────────────────────────────────────────────────────────
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
